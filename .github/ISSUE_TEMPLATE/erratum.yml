name: Erratum
description: Report an error in the book or in this repository
title: "Erratum: "
labels: ["erratum"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: Chapter and section, appendix section, or file in this repository.
      placeholder: "Chapter 9, 'In the field: calibrating the LLM-judge'"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Print
        - eBook
        - This repository
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What it says
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
      description: Add a source if you have one.
    validations:
      required: true
