<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Technical and commercial skill axes">
<title>Technical and commercial skill axes</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#c4c4c4" stroke-width="1.6"/>
  </pattern>
</defs>
<rect width="640" height="560" fill="#ffffff"/>
<rect x="120.0" y="30.0" width="220.0" height="220.0" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="230.0" y="113.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="230.0" dy="0.0">Sales engineer /</tspan><tspan x="230.0" dy="22.5">account manager</tspan></text>
<text x="230.0" y="174.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="230.0" dy="0.0">commercial high,</tspan><tspan x="230.0" dy="18.1">technical low</tspan></text>
<rect x="340.0" y="30.0" width="220.0" height="220.0" fill="#d6e6f5" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="450.0" y="113.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="450.0" dy="0.0">Forward Deployed</tspan><tspan x="450.0" dy="22.5">Engineer</tspan></text>
<text x="450.0" y="183.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="450.0" dy="0.0">both high</tspan></text>
<rect x="120.0" y="250.0" width="220.0" height="220.0" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="230.0" y="333.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="230.0" dy="0.0">Most exposed to</tspan><tspan x="230.0" dy="22.5">automation</tspan></text>
<text x="230.0" y="403.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="230.0" dy="0.0">both low</tspan></text>
<rect x="340.0" y="250.0" width="220.0" height="220.0" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="450.0" y="333.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="450.0" dy="0.0">Traditional</tspan><tspan x="450.0" dy="22.5">engineer</tspan></text>
<text x="450.0" y="394.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="450.0" dy="0.0">technical high,</tspan><tspan x="450.0" dy="18.1">commercial low</tspan></text>
<rect x="340.0" y="30" width="220.0" height="220.0" fill="none" stroke="#2f6fae" stroke-width="3.5"/>
<line x1="120" y1="470" x2="590" y2="470" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<line x1="120" y1="470" x2="120" y2="10" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<text x="340.0" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="340.0" dy="0.0">Technical skill</tspan></text>
<text x="94" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f2933" text-anchor="middle" transform="rotate(-90 94 250.0)">Commercial skill</text>
<text x="340.0" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="340.0" dy="0.0">Commercial skill, in practice, is mostly communication.</tspan></text>
</svg>
