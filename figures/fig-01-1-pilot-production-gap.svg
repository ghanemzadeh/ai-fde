<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" width="640" height="636" role="img" aria-label="The pilot-to-production gap">
<title>The pilot-to-production gap</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#c4c4c4" stroke-width="1.6"/>
  </pattern>
</defs>
<rect width="640" height="636" fill="#ffffff"/>
<rect x="170" y="20" width="300" height="74" rx="8" fill="#d6e6f5" stroke="#2f6fae" stroke-width="1.6"/>
<text x="320" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="320" dy="0.0">Working pilot</tspan></text>
<text x="320" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52606d"><tspan x="320" dy="0.0">sample data · one team · a good demo</tspan></text>
<line x1="320" y1="96" x2="320" y2="124" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<rect x="40" y="128" width="560" height="350" rx="10" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="320" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="320" dy="0.0">The pilot-to-production gap</tspan></text>
<rect x="64" y="172" width="512" height="39" rx="6" fill="#fde2c4" stroke="#c4661f" stroke-width="1.2"/>
