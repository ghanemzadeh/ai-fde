<text x="320" y="441.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2933"><tspan x="320" dy="0.0">Organizational politics and sponsorship</tspan></text>
<line x1="320" y1="480" x2="320" y2="508" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
