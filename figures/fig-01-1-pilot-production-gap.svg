<text x="320" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="320" dy="0.0">Working system</tspan></text>
<text x="320" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52606d"><tspan x="320" dy="0.0">real data, every day, moving a metric</tspan></text>
<text x="320" y="618" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="320" dy="0.0">None of these is a model problem.</tspan></text>
