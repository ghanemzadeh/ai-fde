<text x="527" y="398.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2933"><tspan x="527" dy="0.0">Manual exception queue</tspan></text>
