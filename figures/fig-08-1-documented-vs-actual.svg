<rect x="15" y="433" width="30" height="20" fill="#fde2c4" stroke="#c4661f" stroke-width="1.2"/>
<text x="56" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1f2933"><tspan x="56" dy="0.0">Waiting between steps: queues, handoffs,</tspan></text>
<text x="56" y="467" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" text-anchor="start" fill="#1f2933"><tspan x="56" dy="0.0">approvals. Usually most of the elapsed time.</tspan></text>
