<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 498" width="640" height="498" role="img" aria-label="Four-way triage of process steps">
<title>Four-way triage of process steps</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#c4c4c4" stroke-width="1.6"/>
  </pattern>
</defs>
<rect width="640" height="498" fill="#ffffff"/>
<rect x="15" y="20" width="300" height="82" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="165" y="56.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2933"><tspan x="165" dy="0.0">Does the step still</tspan><tspan x="165" dy="18.8">need to exist?</tspan></text>
<line x1="317" y1="61.0" x2="372" y2="61.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<text x="344" y="52.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="344" dy="0.0">no</tspan></text>
<rect x="374" y="23" width="251" height="76" rx="8" fill="#d6e6f5" stroke="#2f6fae" stroke-width="2"/>
<text x="499" y="49.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="499" dy="0.0">DELETE IT</tspan></text>
<text x="499" y="71.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52606d"><tspan x="499" dy="0.0">Theater, duplicate</tspan><tspan x="499" dy="17.5">checks, legacy handoffs</tspan></text>
<line x1="165" y1="104" x2="165" y2="128" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="180" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52606d"><tspan x="180" dy="0.0">yes</tspan></text>
<rect x="15" y="130" width="300" height="82" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="165" y="166.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2933"><tspan x="165" dy="0.0">Is it a fixed rule</tspan><tspan x="165" dy="18.8">with no judgment?</tspan></text>
<line x1="317" y1="171.0" x2="372" y2="171.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<text x="344" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="344" dy="0.0">yes</tspan></text>
<rect x="374" y="133" width="251" height="76" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="2"/>
<text x="499" y="159.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="499" dy="0.0">PLAIN CODE</tspan></text>
<text x="499" y="181.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52606d"><tspan x="499" dy="0.0">If X then Y; a lookup;</tspan><tspan x="499" dy="17.5">known cases</tspan></text>
<line x1="165" y1="214" x2="165" y2="238" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="180" y="231" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52606d"><tspan x="180" dy="0.0">no</tspan></text>
<rect x="15" y="240" width="300" height="96" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="165" y="274.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2933"><tspan x="165" dy="0.0">Does it need judgment,</tspan><tspan x="165" dy="18.8">with history to learn from</tspan><tspan x="165" dy="18.8">and errors you can catch?</tspan></text>
<line x1="317" y1="288.0" x2="372" y2="288.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<text x="344" y="279.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="344" dy="0.0">yes</tspan></text>
<rect x="374" y="243" width="251" height="90" rx="8" fill="#d8efe0" stroke="#2f8a57" stroke-width="2"/>
<text x="499" y="276.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="499" dy="0.0">AGENT</tspan></text>
<text x="499" y="298.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52606d"><tspan x="499" dy="0.0">Classify, extract, draft,</tspan><tspan x="499" dy="17.5">route; held to the evals</tspan></text>
<line x1="165" y1="338" x2="165" y2="362" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="180" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52606d"><tspan x="180" dy="0.0">no</tspan></text>
<rect x="15" y="364" width="300" height="82" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="165" y="400.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="165" dy="0.0">Otherwise: high-stakes</tspan><tspan x="165" dy="18.8">or irreversible</tspan></text>
<line x1="317" y1="405.0" x2="372" y2="405.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arr-ink)"/>
<rect x="374" y="367" width="251" height="76" rx="8" fill="#fde2c4" stroke="#c4661f" stroke-width="2"/>
<text x="499" y="393.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933"><tspan x="499" dy="0.0">HUMAN DECISION</tspan></text>
<text x="499" y="415.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52606d"><tspan x="499" dy="0.0">Approve, pay, sign;</tspan><tspan x="499" dy="17.5">the agent prepares</tspan></text>
<text x="320" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#52606d" font-style="italic"><tspan x="320" dy="0.0">Sort every mapped step before building anything.</tspan></text>
</svg>
