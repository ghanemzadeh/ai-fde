<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" width="640" height="468" role="img" aria-label="Three FDE contract structures">
<title>Three FDE contract structures</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#c4c4c4" stroke-width="1.6"/>
  </pattern>
</defs>
<rect width="640" height="468" fill="#ffffff"/>
<rect x="90" y="20" width="530" height="104" rx="8" fill="#f1f3f5" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="112" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#1f2933"><tspan x="112" dy="0.0">Milestone</tspan></text>
<text x="112" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52606d" font-style="italic"><tspan x="112" dy="0.0">Best first contract</tspan></text>
<text x="340" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f2933"><tspan x="340" dy="0.0">A fee per verified milestone:</tspan><tspan x="340" dy="19.5">gate cleared, go-live,</tspan><tspan x="340" dy="19.5">metric moved</tspan></text>
<rect x="90" y="138" width="530" height="104" rx="8" fill="#d6e6f5" stroke="#2f6fae" stroke-width="1.6"/>
<text x="112" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#1f2933"><tspan x="112" dy="0.0">Consumption</tspan></text>
<text x="112" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52606d" font-style="italic"><tspan x="112" dy="0.0">Needs a clear unit</tspan></text>
<text x="340" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f2933"><tspan x="340" dy="0.0">A price per unit of work:</tspan><tspan x="340" dy="19.5">ticket resolved, call</tspan><tspan x="340" dy="19.5">handled</tspan></text>
<rect x="90" y="256" width="530" height="104" rx="8" fill="#fde2c4" stroke="#c4661f" stroke-width="1.6"/>
<text x="112" y="294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#1f2933"><tspan x="112" dy="0.0">Value share</tspan></text>
<text x="112" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52606d" font-style="italic"><tspan x="112" dy="0.0">Needs a trusted number</tspan></text>
<text x="340" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f2933"><tspan x="340" dy="0.0">A fraction of the</tspan><tspan x="340" dy="19.5">measured saving or</tspan><tspan x="340" dy="19.5">revenue lift</tspan></text>
<line x1="50" y1="22" x2="50" y2="368" stroke="#1f2933" stroke-width="2.2" marker-end="url(#arr-ink)"/>
<text x="34" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle" transform="rotate(-90 34 195)">More revenue tied to the outcome</text>
<rect x="90" y="384" width="530" height="66" rx="8" fill="#d8efe0" stroke="#2f8a57" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="355" y="412.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2933"><tspan x="355" dy="0.0">Most vendors converge on a hybrid: a base</tspan><tspan x="355" dy="18.8">fee for deployment plus an outcome component</tspan></text>
</svg>
